services:
  - type: web
    name: market-advisor-api
    env: python
    plan: starter # Defaults to starter for production 24/7 reliability (user can select free in UI if needed)
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false # Managed securely in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Managed securely in Render dashboard
      - key: HF_TOKEN
        sync: false # Managed securely in Render dashboard
      - key: HF_MODEL
        value: meta-llama/Llama-3.2-1B-Instruct
      - key: HF_SENTIMENT_MODEL
        value: ProsusAI/finbert
      - key: MARKET
        value: IN
      - key: ENABLE_SCHEDULER
        value: "true" # Run APScheduler natively on Render's 24/7 container
      - key: ADMIN_EMAIL
        value: admin@market.in
      - key: ADMIN_PASSWORD
        sync: false # Managed securely in Render dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false # Managed securely in Render dashboard
      - key: TELEGRAM_CHANNEL_ID
        value: "8594320540"
      - key: CRON_SECRET
        value: market_advisor_secret_992a7c21
